name: Deploy Clients

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/clients
            GIT_SSH_COMMAND="ssh -i ~/.ssh/clients-key" git pull origin main
            bun install
            bun run build
            sudo systemctl restart clients
            curl -f http://localhost:3344/
